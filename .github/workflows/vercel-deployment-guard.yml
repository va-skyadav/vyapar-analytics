name: Vercel Production Deployment Guard

on:
  deployment_status:

permissions:
  deployments: read
  issues: write

jobs:
  guard:
    if: >-
      github.event.deployment_status.environment == 'production' ||
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest

    steps:
      - name: Detect consecutive production deployment failures
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          STATE="${{ github.event.deployment_status.state }}"
          ALERT_TITLE="Vercel production deployment failures"

          if [[ "${STATE}" == "success" ]]; then
            ISSUE_NUMBER="$(gh issue list               --repo "${REPO}"               --state open               --search "${ALERT_TITLE} in:title"               --json number               --jq '.[0].number // empty')"

            if [[ -n "${ISSUE_NUMBER}" ]]; then
              gh issue close "${ISSUE_NUMBER}"                 --repo "${REPO}"                 --comment "Vercel production deployment has recovered."
            fi
            exit 0
          fi

          if [[ "${STATE}" != "failure" && "${STATE}" != "error" ]]; then
            exit 0
          fi

          DEPLOYMENTS="$(gh api             --header "X-GitHub-Api-Version: 2026-03-10"             "repos/${REPO}/deployments?per_page=20")"

          FAILURE_COUNT=0

          while read -r DEPLOYMENT_ID; do
            [[ -z "${DEPLOYMENT_ID}" ]] && continue

            STATUS="$(gh api               --header "X-GitHub-Api-Version: 2026-03-10"               "repos/${REPO}/deployments/${DEPLOYMENT_ID}/statuses?per_page=1"               --jq '.[0].state // empty')"

            case "${STATUS}" in
              failure|error)
                FAILURE_COUNT=$((FAILURE_COUNT + 1))
                ;;
              success)
                break
                ;;
              *)
                break
                ;;
            esac
          done < <(
            echo "${DEPLOYMENTS}" |
              jq -r '[.[] | select(.production_environment == true)] |
                     sort_by(.created_at) | reverse | .[0:10] | .[].id'
          )

          echo "Consecutive production deployment failures: ${FAILURE_COUNT}"

          if (( FAILURE_COUNT >= 3 )); then
            EXISTING="$(gh issue list               --repo "${REPO}"               --state open               --search "${ALERT_TITLE} in:title"               --json number               --jq '.[0].number // empty')"

            if [[ -z "${EXISTING}" ]]; then
              gh issue create                 --repo "${REPO}"                 --title "${ALERT_TITLE}"                 --body "Three or more consecutive Vercel production deployments are currently failing. Check the Vercel deployment logs and the latest commit before retrying."
            fi
          fi
